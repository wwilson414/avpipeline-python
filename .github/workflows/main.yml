name: Build and Upload Release Assets

on:
  push:
    tags:
      - 'v*' # 推送以 v 开头的 tag 时自动触发

permissions:
  contents: write # 允许创建 Release 并上传附件

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync version from Git Tag to pyproject.toml
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "Target package version: ${VERSION} (from tag: ${TAG_NAME})"

          python -c '
          import pathlib, re, sys

          version = sys.argv[1]
          path = pathlib.Path("pyproject.toml")
          content = path.read_text(encoding="utf-8")

          new_content, count = re.subn(
              r"(?m)^(version\s*=\s*)[\"'\''][^\"'\'']*[\"'\'']",
              rf"\g<1>\"{version}\"",
              content,
              count=1,
          )
          if count != 1:
              raise RuntimeError("Failed to uniquely update version in pyproject.toml")

          path.write_text(new_content, encoding="utf-8")
          ' "${VERSION}"

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/* # 自动上传 dist 目录下的 .whl 和 .tar.gz