name: Build and Upload Release Assets

on:
  push:
    tags:
      - 'v*' # 推送以 v 开头的 tag 时自动触发

permissions:
  contents: write # 允许创建 Release 并上传附件

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync version from Git Tag to pyproject.toml
        shell: bash
        run: |
          CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting version to: $CLEAN_VERSION"
          python - <<'EOF'
          import os, pathlib, re

          ver = os.environ["CLEAN_VERSION"]
          path = pathlib.Path("pyproject.toml")
          content = path.read_text(encoding="utf-8")

          updated, count = re.subn(
              r'(?m)^version\s*=\s*["\x27][^"\x27\r\n]*["\x27]',
              f'version = "{ver}"',
              content,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f"Expected 1 version line in pyproject.toml, found {count}")

          path.write_text(updated, encoding="utf-8")
          EOF
        env:
          CLEAN_VERSION: ${{ github.ref_name }}
          
      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/* # 自动上传 dist 目录下的 .whl 和 .tar.gz